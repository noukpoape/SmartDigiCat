<h1>SmartDigiCat is installed</h1>
<p>You will find it in <b>Applications &gt; SmartDigiCat</b> and in Launchpad.</p>
<p>To get started: <b>New</b> (create a project) → <b>Import data</b> → <b>Edit data</b> → <b>Plots</b> / <b>Analysis</b> → <b>Run</b>. The <b>Help</b> button opens the manual.</p>
<p class="note">To uninstall: Applications &gt; SmartDigiCat &gt; Désinstaller SmartDigiCat.</p>
