# Construit les installeurs de SmartDigiCat et les publie dans « Releases ».
#
# Declenchement :
#   - en poussant une etiquette de version :  git tag v1.0.0 && git push origin v1.0.0
#     -> les installeurs sont attaches a la release v1.0.0 ;
#   - a la main (onglet Actions > release > Run workflow) : installeurs de test,
#     telechargeables dans les « artifacts » de l'execution.
#
# Internet n'est utilise que par GitHub pendant la construction : les installeurs
# obtenus contiennent Python et toutes les bibliotheques (installation hors ligne).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"; fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6"

      - name: Build application (PyInstaller)
        env:
          SMARTDIGICAT_VERSION: ${{ env.VERSION }}
        run: pyinstaller installer/smartdigicat.spec --noconfirm

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DMyAppVersion=$env:VERSION" installer\windows\SmartDigiCat.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: SmartDigiCat-Windows
          path: dist/SmartDigiCat-Windows-Setup.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest        # Apple Silicon (M1, M2, M3...)
            arch: arm64
          - runner: macos-15-intel      # Mac Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"; fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6"

      - name: Build application (PyInstaller)
        env:
          SMARTDIGICAT_VERSION: ${{ env.VERSION }}
        run: pyinstaller installer/smartdigicat.spec --noconfirm

      - name: Build installer package (.pkg)
        run: bash installer/macos/build_pkg.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: SmartDigiCat-macOS-${{ matrix.arch }}
          path: dist/SmartDigiCat-macOS-*.pkg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    if: always() && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          fail_on_unmatched_files: false
          body: |
            ## Installation (no internet connection needed)

            | System | File |
            |---|---|
            | Windows 10/11 (64-bit) | `SmartDigiCat-Windows-Setup.exe` |
            | macOS, Apple Silicon (M1, M2...) | `SmartDigiCat-macOS-AppleSilicon.pkg` |
            | macOS, Intel | `SmartDigiCat-macOS-Intel.pkg` |

            See [INSTALL.md](https://github.com/${{ github.repository }}/blob/main/INSTALL.md) for install and uninstall instructions.
